{% load static %}
<body>

    <div hx-swap-oob="true" id="userbg" class="fixed inset-0 -z-10 bg-cover bg-center bg-no-repeat transition-all left-0 duration-1000"
         style="background-image: url('{{ bg_url }}');"></div>

    <div hx-swap-oob="true" id="start_bg" class="fixed inset-0 -z-10 bg-cover bg-center bg-no-repeat transition-all -left-100 duration-1000"
         style="background-image: url('{% static 'images/Wohnzimmer.jpg' %}');"></div>

    <div id="pBereich" class="w-full flex-grow">
        <h1 class="text-center text-white" style="font-size: clamp(2rem, 5vw, 8rem);"><u>Willkommen zurück {{ user.username }}</u></h1>
        <p class="text-center text-gray-200 mt-4 text-2xl">{{ ptext }}</p>
        <span id="authcheck" {% if eingeloggt %}data-authenticated="true"{% endif %} class="hidden"></span>
    </div>

    <div hx-swap-oob="true" id="todoapp" class="w-[25%] text-center">
        <div
            onclick="toggleTodoApp()"
            class="text-white text-lg cursor-pointer bg-yellow-500 px-4 py-2 rounded-t hover:bg-yellow-600">
            <h3>ToDo-App</h3>
        </div>

        <div
            id="todo-wrapper"
            class="transition-all duration-750 ease-in-out overflow-hidden max-h-0">
            <table class="table-fixed w-full border-2 border-yellow-500 bg-gray-700/40">
                <thead class="border-b border-yellow-500">
                    <tr>
                        <th scope="col">Erledigt?</th>
                        <th scope="col">ToDo-App</th>
                        <th scope="col">Details verfügbar?</th>
                    </tr>
                </thead>
                <tbody id="todo-table-body" class="divide-y divide-yellow-500" >
                    {% if user.is_authenticated %}
                        {% for todo in todos %}
                        <tr>
                            <td><input type="checkbox" class="cursor-pointer" id="todo-{{ todo.id }}"></td>
                            <td><label for="todo-{{ todo.id }}">{{ todo.title }}</label></td>
                            <td>{% if todo.description %}
                                <span class="font-bold text-green-500 hover:text-green-600 cursor-pointer"
                                      onclick="showDetails(this)"
                                      data-description="{{ todo.description|escapejs }}">
                                    &#x276F;
                                </span>
                            {% else %}
                                <span class="font-bold text-red-600 cursor-default">X</span>
                            {% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    {% endif %}
                </tbody>
            </table>
            <div class="border-yellow-500 rounded-b-lg p-4 border-2 border-t-0 rounded-b-lg bg-gray-700/40 gap-2">
                <form
                    class="flex flex-col items-center border-yellow-500"
                    hx-post="{% url 'add_todo' %}"
                    hx-target="#todo-table-body"
                    hx-swap="beforeend"
                    >
                    {% csrf_token %}
                    <input type="text" name="title" placeholder="neue Aufgabe" class="border w-full rounded px-1" required>
                    <textarea name="description" rows="2" placeholder="ggf. Details" class="border w-full rounded px-1 mt-2 resize-none"></textarea>
                    <button type="submit" class="bg-green-500 hover:bg-green-600 text-white rounded-lg mt-2 px-2 py-1 cursor-pointer">
                        Hinzufügen
                    </button>
                    <button type="button" class="bg-red-600 hover:bg-red-700 text-white rounded-lg mt-2 px-2 py-1 cursor-pointer" onclick="clearTodos()">Erledigte Aufgaben löschen!</button>
                </form>
            </div>
        </div>
    </div>

</body>
